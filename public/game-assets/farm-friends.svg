<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ff-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#7dd3fc"/>
      <stop offset="85%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="ff-hills" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <radialGradient id="ff-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="ff-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Bright Sunny Farm Sky -->
  <rect width="800" height="450" fill="url(#ff-sky)"/>
  <circle cx="700" cy="90" r="70" fill="url(#ff-sun)"/>

  <!-- Fluffy White Clouds -->
  <ellipse cx="160" cy="70" rx="60" ry="25" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="200" cy="60" rx="40" ry="20" fill="#ffffff" opacity="0.9"/>
  <ellipse cx="480" cy="110" rx="70" ry="25" fill="#ffffff" opacity="0.8"/>

  <!-- Rolling Green Countryside Hills -->
  <ellipse cx="150" cy="360" rx="300" ry="140" fill="url(#ff-hills)"/>
  <ellipse cx="650" cy="380" rx="350" ry="150" fill="#22c55e"/>
  <ellipse cx="400" cy="420" rx="450" ry="140" fill="#15803d"/>

  <!-- TRADITIONAL RED AMERICAN BARN & SILO (Left Midground) -->
  <g transform="translate(100, 160)">
    <!-- Silo Dome -->
    <rect x="-35" y="10" width="30" height="90" rx="4" fill="#94a3b8" stroke="#64748b" stroke-width="2"/>
    <ellipse cx="-20" cy="10" rx="15" ry="8" fill="#cbd5e1"/>
    <!-- Red Barn Structure -->
    <rect x="0" y="20" width="130" height="85" fill="#dc2626" stroke="#991b1b" stroke-width="3"/>
    <polygon points="-10,20 65,-30 140,20" fill="#b91c1c" stroke="#7f1d1d" stroke-width="3"/>
    <!-- Barn White Cross Doors -->
    <rect x="40" y="55" width="50" height="50" fill="#ffffff"/>
    <line x1="40" y1="55" x2="90" y2="105" stroke="#dc2626" stroke-width="3"/>
    <line x1="90" y1="55" x2="40" y2="105" stroke="#dc2626" stroke-width="3"/>
    <!-- Hayloft Window with Golden Straw -->
    <rect x="50" y="5" width="30" height="25" rx="3" fill="#451a03"/>
    <circle cx="65" cy="20" r="8" fill="#facc15"/>
  </g>

  <!-- GREEN TRACTOR WITH BIG WHEELS (Right Midground) -->
  <g transform="translate(600, 240)">
    <rect x="-10" y="-15" width="45" height="35" rx="5" fill="#15803d" stroke="#166534" stroke-width="2"/>
    <rect x="35" y="-5" width="45" height="25" rx="3" fill="#15803d"/>
    <!-- Exhaust Smoke Stack -->
    <line x1="60" y1="-5" x2="60" y2="-25" stroke="#475569" stroke-width="4"/>
    <!-- Wheels -->
    <circle cx="70" cy="30" r="18" fill="#18181b" stroke="#eab308" stroke-width="6"/>
    <circle cx="10" cy="25" r="28" fill="#18181b" stroke="#eab308" stroke-width="8"/>
  </g>

  <!-- SOIL VEGETABLE PLOTS & SUNFLOWERS (Foreground) -->
  <rect x="0" y="320" width="800" height="130" fill="#78350f"/>
  <ellipse cx="400" cy="330" rx="420" ry="25" fill="#92400e"/>

  <!-- Plump Orange Pumpkins & Red Strawberries -->
  <circle cx="120" cy="390" r="22" fill="#ea580c" stroke="#c2410c" stroke-width="3"/>
  <polygon points="120,368 115,358 125,358" fill="#15803d"/>
  <circle cx="160" cy="405" r="18" fill="#ea580c" stroke="#c2410c" stroke-width="3"/>
  <circle cx="680" cy="395" r="20" fill="#ea580c" stroke="#c2410c" stroke-width="3"/>

  <!-- CUTE FARM ANIMALS (Piglet & Cow) -->
  <!-- Cute Piglet (Left) -->
  <g transform="translate(240, 340)">
    <ellipse cx="0" cy="0" rx="28" ry="20" fill="#f472b6" stroke="#db2777" stroke-width="2"/>
    <circle cx="20" cy="-6" r="14" fill="#f472b6"/>
    <ellipse cx="28" cy="-4" rx="6" ry="4" fill="#db2777"/>
    <circle cx="18" cy="-10" r="2" fill="#000000"/>
    <!-- Legs -->
    <line x1="-12" y1="18" x2="-12" y2="30" stroke="#db2777" stroke-width="5" stroke-linecap="round"/>
    <line x1="12" y1="18" x2="12" y2="30" stroke="#db2777" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Friendly Dairy Cow (Right) -->
  <g transform="translate(520, 320)">
    <ellipse cx="0" cy="0" rx="38" ry="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Black Spots -->
    <path d="M-15,-10 Q0,5 -10,15 Q-25,5 -15,-10 Z" fill="#1e293b"/>
    <path d="M15,-5 Q30,10 20,20 Q10,10 15,-5 Z" fill="#1e293b"/>
    <!-- Head & Horns -->
    <circle cx="-35" cy="-10" r="18" fill="#f8fafc"/>
    <ellipse cx="-45" cy="-8" rx="8" ry="6" fill="#f472b6"/>
    <circle cx="-38" cy="-15" r="3" fill="#000000"/>
    <polygon points="-38,-26 -44,-36 -32,-28" fill="#eab308"/>
  </g>

  <!-- CHEERFUL FARMER HERO (Center Stage with Straw Hat & Pitchfork) -->
  <g transform="translate(380, 260)">
    <!-- Blue Overalls & Red Plaid Shirt -->
    <path d="M-22,25 L-30,95 L30,95 L22,25 Z" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
    <rect x="-18" y="10" width="36" height="35" fill="#dc2626"/> <!-- Red Plaid Shirt -->
    <rect x="-12" y="18" width="24" height="25" fill="#2563eb"/> <!-- Overall Pocket -->
    <circle cx="-8" cy="22" r="3" fill="#eab308"/>
    <circle cx="8" cy="22" r="3" fill="#eab308"/>

    <!-- Farmer Head & Big Smile -->
    <circle cx="0" cy="-10" r="18" fill="#fbcfe8"/>
    <circle cx="-6" cy="-12" r="2.5" fill="#1e293b"/>
    <circle cx="6" cy="-12" r="2.5" fill="#1e293b"/>
    <path d="M-6,-4 Q0,4 6,-4" stroke="#db2777" stroke-width="2.5" fill="none"/>

    <!-- Wide Brim Straw Hat with Sunflower -->
    <ellipse cx="0" cy="-24" rx="42" ry="12" fill="#facc15" stroke="#ca8a04" stroke-width="2"/>
    <ellipse cx="0" cy="-28" rx="22" ry="14" fill="#eab308"/>
    <circle cx="16" cy="-26" r="6" fill="#ea580c"/>

    <!-- Strong Arms Waving & Golden Pitchfork in Hand -->
    <path d="M-18,20 L-40,45 L-30,65" stroke="#fbcfe8" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M18,20 L45,10 L70,30" stroke="#fbcfe8" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- Pitchfork in Hand -->
    <line x1="70" y1="-20" x2="70" y2="105" stroke="#78350f" stroke-width="5" stroke-linecap="round"/>
    <path d="M55,-20 L85,-20" stroke="#94a3b8" stroke-width="4"/>
    <line x1="58" y1="-40" x2="58" y2="-20" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <line x1="70" y1="-45" x2="70" y2="-20" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <line x1="82" y1="-40" x2="82" y2="-20" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
