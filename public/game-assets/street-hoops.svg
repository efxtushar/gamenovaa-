<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sh-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d1f"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#31103f"/>
    </linearGradient>
    <radialGradient id="sh-fire" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#sh-bg)"/>

  <!-- City Skyline / Fence at Night -->
  <polygon points="40,260 90,180 140,180 140,260" fill="#0f172a"/>
  <polygon points="120,260 160,140 210,140 210,260" fill="#090d16"/>
  <polygon points="620,260 670,160 740,160 740,260" fill="#0f172a"/>

  <!-- Street Court Floor -->
  <polygon points="0,320 800,320 800,450 0,450" fill="#181829"/>
  <!-- Glowing Court Markings -->
  <ellipse cx="400" cy="380" rx="280" ry="60" fill="none" stroke="#f97316" stroke-width="2" opacity="0.6"/>
  <line x1="0" y1="360" x2="800" y2="360" stroke="#a855f7" stroke-width="2" opacity="0.5"/>

  <!-- Basketball Hoop & Backboard (Glowing Neon) -->
  <g transform="translate(580, 110)">
    <!-- Backboard -->
    <rect x="0" y="0" width="110" height="80" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="3"/>
    <rect x="30" y="25" width="50" height="35" rx="2" fill="none" stroke="#f97316" stroke-width="2"/>
    <!-- Rim -->
    <ellipse cx="25" cy="65" rx="25" ry="8" fill="none" stroke="#ea580c" stroke-width="5" filter="url(#sh-glow)"/>
    <!-- Chain Net -->
    <path d="M 0 65 L 12 115 L 38 115 L 50 65" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    <line x1="12" y1="65" x2="25" y2="115" stroke="#e2e8f0" stroke-width="1.5"/>
    <line x1="38" y1="65" x2="25" y2="115" stroke="#e2e8f0" stroke-width="1.5"/>
    <ellipse cx="25" cy="115" rx="14" ry="4" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    <!-- Support Pole -->
    <line x1="110" y1="40" x2="160" y2="280" stroke="#334155" stroke-width="8"/>
  </g>

  <!-- Basketball on Fire (Slam Dunk Arc) -->
  <g transform="translate(480, 140)">
    <!-- Fire Tail -->
    <path d="M -160 120 Q -90 20 0 0" stroke="url(#sh-fire)" stroke-width="24" fill="none" stroke-linecap="round" opacity="0.7" filter="url(#sh-glow)"/>
    <path d="M -120 100 Q -60 15 0 0" stroke="#fef08a" stroke-width="8" fill="none" stroke-linecap="round"/>

    <!-- The Basketball -->
    <circle cx="0" cy="0" r="30" fill="#ea580c" stroke="#9a3412" stroke-width="2"/>
    <!-- Seams -->
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#431407" stroke-width="2.5"/>
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#431407" stroke-width="2.5"/>
    <path d="M -20 -20 Q 0 0 -20 20" stroke="#431407" stroke-width="2.5" fill="none"/>
    <path d="M 20 -20 Q 0 0 20 20" stroke="#431407" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Street Basketball Player Silhouette (Mid-Air Jumper) -->
  <g transform="translate(240, 240)">
    <!-- Shadow -->
    <ellipse cx="0" cy="110" rx="35" ry="10" fill="#000" opacity="0.6"/>

    <!-- Player Body -->
    <circle cx="0" cy="-60" r="16" fill="#090d16"/>
    <!-- Glowing Headband -->
    <line x1="-14" y1="-62" x2="14" y2="-62" stroke="#f97316" stroke-width="3" filter="url(#sh-glow)"/>
    
    <!-- Torso / Jersey -->
    <path d="M -15 -42 L 15 -42 L 12 10 L -12 10 Z" fill="#1e1b4b" stroke="#f97316" stroke-width="1.5"/>
    <text x="0" y="-12" font-family="'Orbitron', sans-serif" font-size="14" font-weight="900" fill="#f97316" text-anchor="middle">23</text>

    <!-- Arms Shooting Up -->
    <path d="M -12 -38 L 10 -75 L 35 -95" stroke="#090d16" stroke-width="9" stroke-linecap="round" fill="none"/>
    <!-- Legs in Air -->
    <path d="M -8 10 L -25 50 L -40 45" stroke="#090d16" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M 8 10 L 25 55 L 45 80" stroke="#090d16" stroke-width="10" stroke-linecap="round" fill="none"/>
    <!-- Sneakers with Neon Soles -->
    <line x1="35" y1="80" x2="55" y2="80" stroke="#38bdf8" stroke-width="4" filter="url(#sh-glow)"/>
    <line x1="-50" y1="45" x2="-30" y2="45" stroke="#38bdf8" stroke-width="4" filter="url(#sh-glow)"/>
  </g>

  <!-- Titles -->
  <text x="30" y="45" font-family="'Orbitron', sans-serif" font-weight="800" font-size="20" fill="#f97316" letter-spacing="3">STREET HOOPS</text>
  <text x="30" y="70" font-family="'Chakra Petch', sans-serif" font-weight="600" font-size="12" fill="#38bdf8" letter-spacing="4">ARCADE BASKETBALL 3D</text>
  <rect x="690" y="30" width="80" height="24" rx="4" fill="#ea580c" fill-opacity="0.2" stroke="#f97316" stroke-width="1.5"/>
  <text x="730" y="46" font-family="'Orbitron', sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">SPORTS</text>
</svg>
