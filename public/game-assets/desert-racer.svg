<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="dr-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="40%" stop-color="#9a3412"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="dr-dune" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="dr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#dr-sky)"/>

  <!-- Scorching Desert Sun -->
  <circle cx="220" cy="130" r="80" fill="#fef08a" opacity="0.8" filter="url(#dr-glow)"/>
  <circle cx="220" cy="130" r="45" fill="#ffffff"/>

  <!-- Distant Canyon Buttes & Mesas -->
  <polygon points="40,240 60,180 140,180 160,240" fill="#78350f" opacity="0.7"/>
  <polygon points="500,240 530,160 620,160 650,240" fill="#78350f" opacity="0.7"/>
  <polygon points="680,240 700,190 760,190 780,240" fill="#78350f" opacity="0.7"/>

  <!-- Sand Dunes -->
  <path d="M 0 280 Q 200 210 420 260 Q 640 310 800 240 L 800 450 L 0 450 Z" fill="url(#dr-dune)"/>
  <path d="M 0 350 Q 280 270 560 330 Q 700 360 800 320 L 800 450 L 0 450 Z" fill="#92400e"/>

  <!-- Massive Dust / Sand Rooster Trail -->
  <path d="M 120 380 Q 220 290 340 320 Q 240 370 140 420 Z" fill="#fde68a" opacity="0.7" filter="url(#dr-glow)"/>
  <circle cx="240" cy="330" r="28" fill="#fef08a" opacity="0.4" filter="url(#dr-glow)"/>
  <circle cx="180" cy="360" r="40" fill="#f59e0b" opacity="0.5" filter="url(#dr-glow)"/>

  <!-- Off-Road Baja Trophy Truck / Buggy (Airborne over Dune Jump) -->
  <g transform="translate(420, 240) rotate(-10)">
    <!-- Chassis Shadow -->
    <ellipse cx="60" cy="90" rx="90" ry="20" fill="#451a03" opacity="0.6"/>

    <!-- Large Knobby Off-Road Tires -->
    <!-- Rear Wheel -->
    <circle cx="0" cy="50" r="32" fill="#1c1917" stroke="#ea580c" stroke-width="4"/>
    <circle cx="0" cy="50" r="16" fill="#78716c"/>
    <!-- Front Wheel -->
    <circle cx="130" cy="50" r="32" fill="#1c1917" stroke="#ea580c" stroke-width="4"/>
    <circle cx="130" cy="50" r="16" fill="#78716c"/>

    <!-- Exposed Suspension Coils & Roll Cage -->
    <line x1="0" y1="50" x2="20" y2="15" stroke="#f59e0b" stroke-width="5"/>
    <line x1="130" y1="50" x2="110" y2="15" stroke="#f59e0b" stroke-width="5"/>

    <!-- Tubular Rollcage -->
    <path d="M 10 15 L 40 -25 L 95 -25 L 120 15" stroke="#f97316" stroke-width="5" fill="none"/>
    <line x1="50" y1="15" x2="70" y2="-25" stroke="#f97316" stroke-width="4"/>

    <!-- Body Panels (High Vis Neon Orange & Yellow) -->
    <path d="M -15 20 L 25 10 L 60 10 L 95 -5 L 145 10 L 160 25 L -10 25 Z" fill="#ea580c" stroke="#fed7aa" stroke-width="2"/>
    <!-- Roof Light Bar (4 Blazing LEDs) -->
    <rect x="40" y="-30" width="55" height="6" fill="#0f172a"/>
    <circle cx="48" cy="-27" r="3" fill="#ffffff" filter="url(#dr-glow)"/>
    <circle cx="61" cy="-27" r="3" fill="#ffffff" filter="url(#dr-glow)"/>
    <circle cx="74" cy="-27" r="3" fill="#ffffff" filter="url(#dr-glow)"/>
    <circle cx="87" cy="-27" r="3" fill="#ffffff" filter="url(#dr-glow)"/>
  </g>

  <!-- Titles -->
  <text x="30" y="45" font-family="'Orbitron', sans-serif" font-weight="800" font-size="20" fill="#f59e0b" letter-spacing="3">DESERT RACER</text>
  <text x="30" y="70" font-family="'Chakra Petch', sans-serif" font-weight="600" font-size="12" fill="#fed7aa" letter-spacing="4">OFF-ROAD DUNE RALLY</text>
  <rect x="690" y="30" width="80" height="24" rx="4" fill="#c2410c" fill-opacity="0.2" stroke="#f97316" stroke-width="1.5"/>
  <text x="730" y="46" font-family="'Orbitron', sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">RACING</text>
</svg>
