<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bc-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140508"/>
      <stop offset="50%" stop-color="#2d0a12"/>
      <stop offset="100%" stop-color="#090204"/>
    </linearGradient>
    <filter id="bc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bc-bg)"/>

  <!-- Demolition Derby Arena Metal Floor & Hazard Grate -->
  <polygon points="0,260 800,260 800,450 0,450" fill="#171217"/>
  <line x1="0" y1="260" x2="800" y2="260" stroke="#ef4444" stroke-width="3" filter="url(#bc-glow)"/>
  
  <!-- Fire hazards in arena -->
  <ellipse cx="140" cy="310" rx="30" ry="12" fill="#ef4444" opacity="0.4" filter="url(#bc-glow)"/>
  <ellipse cx="660" cy="310" rx="30" ry="12" fill="#ef4444" opacity="0.4" filter="url(#bc-glow)"/>

  <!-- Mid-Arena Metal Collision & Explosion -->
  <g transform="translate(400, 290)">
    <!-- Shockwave Ring -->
    <circle cx="0" cy="0" r="60" fill="none" stroke="#facc15" stroke-width="5" opacity="0.9" filter="url(#bc-glow)"/>
    <circle cx="0" cy="0" r="30" fill="#ffffff" filter="url(#bc-glow)"/>
    <!-- Fire bursts -->
    <path d="M 0 -30 L 25 -70 L -15 -50 L -30 -85 L -45 -40 L -80 -60 L -50 -10 Z" fill="#f97316" filter="url(#bc-glow)"/>
    <path d="M 0 -20 L 15 -50 L -10 -35 L -20 -60 Z" fill="#fef08a"/>
    <!-- Flying Shrapnel -->
    <rect x="-40" y="-50" width="8" height="8" fill="#e2e8f0" transform="rotate(45 -40 -50)"/>
    <rect x="50" y="-40" width="10" height="6" fill="#e2e8f0" transform="rotate(-30 50 -40)"/>
    <rect x="-20" y="30" width="6" height="12" fill="#e2e8f0" transform="rotate(15 -20 30)"/>
  </g>

  <!-- Armored Car 1 (Red Destroyer with Roof Rocket Launcher) -->
  <g transform="translate(240, 290) rotate(12)">
    <!-- Shadow -->
    <ellipse cx="0" cy="45" rx="85" ry="20" fill="#000" opacity="0.8"/>
    <!-- Big Spiked Tires -->
    <circle cx="-55" cy="35" r="24" fill="#18181b" stroke="#71717a" stroke-width="4"/>
    <circle cx="55" cy="35" r="24" fill="#18181b" stroke="#71717a" stroke-width="4"/>
    <!-- Armored Body -->
    <polygon points="-80,25 -65,-5 20,-10 65,10 90,25 80,35 -75,35" fill="#dc2626" stroke="#f87171" stroke-width="2"/>
    <!-- Spiked Ram Bumper -->
    <polygon points="90,15 115,25 90,35" fill="#e2e8f0"/>
    <!-- Roof Missile Pod -->
    <rect x="-25" y="-30" width="45" height="16" rx="3" fill="#1c1917" stroke="#ea580c" stroke-width="2"/>
    <circle cx="20" cy="-22" r="4" fill="#ef4444" filter="url(#bc-glow)"/>
  </g>

  <!-- Armored Car 2 (Cyan Enforcer with Minigun) -->
  <g transform="translate(560, 290) rotate(-12)">
    <!-- Shadow -->
    <ellipse cx="0" cy="45" rx="85" ry="20" fill="#000" opacity="0.8"/>
    <!-- Tires -->
    <circle cx="-55" cy="35" r="24" fill="#18181b" stroke="#71717a" stroke-width="4"/>
    <circle cx="55" cy="35" r="24" fill="#18181b" stroke="#71717a" stroke-width="4"/>
    <!-- Armored Body -->
    <polygon points="80,25 65,-5 -20,-10 -65,10 -90,25 -80,35 75,35" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <!-- Spiked Front Bumper -->
    <polygon points="-90,15 -115,25 -90,35" fill="#e2e8f0"/>
    <!-- Dual Gatling Guns -->
    <line x1="-30" y1="-20" x2="-80" y2="-20" stroke="#94a3b8" stroke-width="6"/>
    <!-- Muzzle Flash -->
    <circle cx="-85" cy="-20" r="10" fill="#fef08a" filter="url(#bc-glow)"/>
  </g>

  <!-- Titles -->
  <text x="30" y="45" font-family="'Orbitron', sans-serif" font-weight="800" font-size="20" fill="#ef4444" letter-spacing="3">BATTLE CARS</text>
  <text x="30" y="70" font-family="'Chakra Petch', sans-serif" font-weight="600" font-size="12" fill="#facc15" letter-spacing="4">DEMOLITION DERBY ARENA</text>
  <rect x="680" y="30" width="90" height="24" rx="4" fill="#7f1d1d" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="725" y="46" font-family="'Orbitron', sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">ACTION</text>
</svg>
