<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="jr-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="40%" stop-color="#047857"/>
      <stop offset="80%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="jr-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="70%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
    <filter id="jr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dense Tropical Rainforest Canopy & Golden Sunset -->
  <rect width="800" height="450" fill="url(#jr-sky)"/>
  <circle cx="600" cy="120" r="85" fill="url(#jr-sun)"/>

  <!-- Ancient Mayan Stepped Pyramids in Jungle -->
  <g fill="#1f2937" stroke="#111827" stroke-width="2">
    <!-- Main Pyramid Steps -->
    <polygon points="400,280 480,110 560,110 640,280" fill="#374151"/>
    <rect x="495" y="80" width="50" height="30" fill="#1f2937"/>
    <!-- Overgrown Vines hanging off Temple -->
    <path d="M480,110 Q460,180 470,260" stroke="#15803d" stroke-width="4" fill="none"/>
    <path d="M560,110 Q580,170 550,250" stroke="#15803d" stroke-width="4" fill="none"/>
  </g>

  <!-- Jungle Canopy Vines & Palm Trees -->
  <path d="M0,0 Q180,120 360,0" stroke="#166534" stroke-width="8" fill="none"/>
  <path d="M300,0 Q500,140 700,0" stroke="#166534" stroke-width="8" fill="none"/>

  <!-- Ancient Temple Stone Path Floor -->
  <rect x="0" y="290" width="800" height="160" fill="#78350f"/>
  <rect x="0" y="310" width="800" height="140" fill="#14532d"/>
  <polygon points="0,310 800,310 800,450 0,450" fill="#3f2305"/>

  <!-- GIANT ROLLING ANCIENT STONE BOULDER (Chasing the Hero from Left) -->
  <g transform="translate(180, 220)">
    <!-- Heavy Shadow -->
    <ellipse cx="0" cy="95" rx="80" ry="20" fill="#000000" opacity="0.8"/>
    <!-- Giant Cracked Boulder -->
    <circle cx="0" cy="0" r="85" fill="#475569" stroke="#334155" stroke-width="6"/>
    <circle cx="0" cy="0" r="78" fill="#64748b"/>
    <!-- Ancient Rune Carvings & Deep Cracks -->
    <path d="M-40,-30 Q0,-10 30,-50" stroke="#1e293b" stroke-width="5" fill="none"/>
    <path d="M-20,20 Q20,40 50,0" stroke="#1e293b" stroke-width="5" fill="none"/>
    <!-- Dust Smoke Puff behind Boulder -->
    <circle cx="-70" cy="65" r="25" fill="#92400e" opacity="0.7"/>
    <circle cx="-100" cy="45" r="30" fill="#92400e" opacity="0.5"/>
  </g>

  <!-- TEMPLE EXPLORER HERO (Sprinting Right - Dynamic Escape Action) -->
  <g transform="translate(460, 240)">
    <!-- Shadow -->
    <ellipse cx="0" cy="85" rx="45" ry="12" fill="#000000" opacity="0.7"/>

    <!-- Brown Explorer Outfit & Leather Bag -->
    <path d="M-15,-10 L-25,45 L25,45 L15,-10 Z" fill="#d97706" stroke="#b45309" stroke-width="2"/>
    <rect x="-10" y="5" width="20" height="25" fill="#fef3c7"/> <!-- Khaki Shirt -->
    <!-- Leather Satchel Strap -->
    <line x1="-15" y1="-5" x2="20" y2="35" stroke="#78350f" stroke-width="5"/>
    <rect x="15" y="25" width="16" height="18" rx="3" fill="#78350f"/>

    <!-- Running Legs (Mid-stride sprint) -->
    <path d="M-15,40 L-45,65 L-65,60" stroke="#451a03" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M15,40 L45,65 L70,85" stroke="#451a03" stroke-width="12" stroke-linecap="round" fill="none"/>

    <!-- Head & Explorer Fedora Hat -->
    <circle cx="0" cy="-25" r="16" fill="#fbcfe8"/>
    <ellipse cx="0" cy="-36" rx="36" ry="10" fill="#78350f" stroke="#451a03" stroke-width="2"/>
    <ellipse cx="0" cy="-40" rx="18" ry="12" fill="#92400e"/>

    <!-- Arms Pumping with GOLDEN MAYAN IDOL CLUTCHED IN HAND -->
    <path d="M-15,-5 L-40,-20 L-50,-10" stroke="#fbcfe8" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Right Arm Holding Glowing Gold Idol -->
    <path d="M15,-5 L45,-15 L50,-30" stroke="#fbcfe8" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- GOLDEN IDOL STATUE (Gleaming in Sunlight) -->
    <rect x="42" y="-55" width="22" height="30" rx="4" fill="#fbbf24" stroke="#d97706" stroke-width="2" filter="url(#jr-glow)"/>
    <circle cx="53" cy="-45" r="4" fill="#ea580c"/>
  </g>
</svg>
