<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="nd-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14020a"/>
      <stop offset="40%" stop-color="#3b0a1d"/>
      <stop offset="70%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <radialGradient id="nd-moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <filter id="nd-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Blood Red / Sunset Sky -->
  <rect width="800" height="450" fill="url(#nd-bg)"/>

  <!-- Giant Blood Moon -->
  <circle cx="480" cy="180" r="130" fill="url(#nd-moon)"/>
  
  <!-- Silhouette Japanese Temple / Pagoda & Torii Gate -->
  <g fill="#0a0508">
    <path d="M 80 280 L 100 240 L 130 240 L 140 280 Z"/>
    <polygon points="60,240 150,240 140,210 70,210"/>
    <polygon points="40,210 170,210 160,180 50,180"/>
    <polygon points="20,180 190,180 105,120"/>
    <line x1="105" y1="120" x2="105" y2="80" stroke="#0a0508" stroke-width="4"/>

    <!-- Rooftops (Platform where Ninja Sprints) -->
    <path d="M 0 350 L 220 310 L 260 380 L 400 340 L 450 410 L 700 320 L 780 340 L 800 450 L 0 450 Z"/>
  </g>

  <!-- Flying Cherry Blossom Petals -->
  <g fill="#f43f5e" opacity="0.8">
    <ellipse cx="200" cy="160" rx="6" ry="3" transform="rotate(25 200 160)"/>
    <ellipse cx="320" cy="190" rx="8" ry="4" transform="rotate(-35 320 190)"/>
    <ellipse cx="410" cy="130" rx="5" ry="3" transform="rotate(45 410 130)"/>
    <ellipse cx="580" cy="220" rx="7" ry="4" transform="rotate(-15 580 220)"/>
    <ellipse cx="640" cy="150" rx="6" ry="3" transform="rotate(60 640 150)"/>
  </g>

  <!-- Spinning Shurikens in Motion -->
  <g transform="translate(620, 240)">
    <circle cx="0" cy="0" r="28" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,4" filter="url(#nd-blur)"/>
    <!-- 4-point star -->
    <polygon points="0,-22 6,-6 22,0 6,6 0,22 -6,6 -22,0 -6,-6" fill="#e2e8f0" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="4" fill="#ef4444"/>
  </g>

  <!-- Ninja Hero Silhouette (Mid-Air Sprint & Katana Slash) -->
  <g transform="translate(380, 230)">
    <!-- Red Slash Arc -->
    <path d="M -90 -80 Q 0 -130 90 -40" stroke="#ef4444" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#nd-blur)"/>
    <path d="M -80 -75 Q 0 -120 80 -40" stroke="#ffffff" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Ninja Shadow -->
    <ellipse cx="10" cy="110" rx="40" ry="10" fill="#000000" opacity="0.6"/>

    <!-- Ninja Head & Mask -->
    <circle cx="0" cy="-35" r="16" fill="#0f090c"/>
    <!-- Glowing Red Ninja Eyes / Mask Visor -->
    <line x1="4" y1="-37" x2="16" y2="-36" stroke="#ef4444" stroke-width="3" filter="url(#nd-blur)"/>
    <line x1="4" y1="-37" x2="16" y2="-36" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Flowing Red Scarf -->
    <path d="M -10 -30 Q -60 -45 -110 -15 Q -140 0 -180 -25" stroke="#dc2626" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M -10 -27 Q -70 -35 -120 -5" stroke="#ef4444" stroke-width="4" fill="none" stroke-linecap="round"/>

    <!-- Ninja Body / Torso (Athletic Dash) -->
    <path d="M -12 -20 L 14 -20 L 10 25 L -14 22 Z" fill="#090507"/>
    <!-- Ninja Belt -->
    <rect x="-13" y="10" width="26" height="5" fill="#dc2626"/>

    <!-- Front Leg (Knee High Dash) -->
    <path d="M 6 22 L 35 40 L 45 75" stroke="#090507" stroke-width="12" stroke-linecap="round" fill="none"/>
    <!-- Back Leg (Extended) -->
    <path d="M -10 22 L -35 55 L -60 70" stroke="#090507" stroke-width="11" stroke-linecap="round" fill="none"/>

    <!-- Katana & Arm -->
    <path d="M 0 -15 L 45 -45" stroke="#090507" stroke-width="10" stroke-linecap="round"/>
    <line x1="40" y1="-45" x2="110" y2="-100" stroke="#e2e8f0" stroke-width="4"/>
    <line x1="40" y1="-45" x2="110" y2="-100" stroke="#38bdf8" stroke-width="1" filter="url(#nd-blur)"/>
  </g>

  <!-- Titles -->
  <text x="30" y="45" font-family="'Orbitron', sans-serif" font-weight="800" font-size="20" fill="#f43f5e" letter-spacing="3">NINJA DASH</text>
  <text x="30" y="70" font-family="'Chakra Petch', sans-serif" font-weight="600" font-size="12" fill="#fb923c" letter-spacing="4">ROOFTOP SHADOW RUNNER</text>
  <rect x="690" y="30" width="80" height="24" rx="4" fill="#dc2626" fill-opacity="0.2" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="730" y="46" font-family="'Orbitron', sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">ACTION</text>
</svg>
