<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sm-space" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>
    <radialGradient id="sm-crystal" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="60%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#083344"/>
    </radialGradient>
    <filter id="sm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#sm-space)"/>

  <!-- Glowing Stars & Cosmic Gas -->
  <circle cx="140" cy="80" r="1.5" fill="#38bdf8"/>
  <circle cx="280" cy="140" r="2" fill="#e2e8f0"/>
  <circle cx="680" cy="70" r="2" fill="#a855f7"/>
  <circle cx="740" cy="220" r="1.5" fill="#38bdf8"/>

  <!-- Giant Asteroid on Left -->
  <g transform="translate(180, 280)">
    <polygon points="-120,-80 40,-130 140,-40 120,80 -20,120 -130,50" fill="#334155" stroke="#475569" stroke-width="4"/>
    <!-- Glowing Blue/Cyan Mineral Crystals Sprouting from Rock -->
    <polygon points="-40,-60 -20,-110 0,-70" fill="url(#sm-crystal)" filter="url(#sm-glow)"/>
    <polygon points="10,-50 35,-95 45,-60" fill="url(#sm-crystal)" filter="url(#sm-glow)"/>
    <polygon points="60,-30 90,-70 100,-25" fill="url(#sm-crystal)" filter="url(#sm-glow)"/>
    <polygon points="-70,0 -110,-20 -80,25" fill="url(#sm-crystal)" filter="url(#sm-glow)"/>
    <!-- Crystal Sparkles -->
    <circle cx="-20" cy="-110" r="4" fill="#ffffff" filter="url(#sm-glow)"/>
    <circle cx="35" cy="-95" r="3" fill="#ffffff" filter="url(#sm-glow)"/>
  </g>

  <!-- Heavy Mining Drone / Spaceship on Right -->
  <g transform="translate(490, 180) rotate(-15)">
    <!-- Mining Drill Laser Beam -->
    <line x1="-80" y1="20" x2="-260" y2="90" stroke="#00ffff" stroke-width="8" stroke-linecap="round" filter="url(#sm-glow)"/>
    <line x1="-80" y1="20" x2="-260" y2="90" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <!-- Laser impact explosion on asteroid -->
    <circle cx="-260" cy="90" r="25" fill="#38bdf8" opacity="0.8" filter="url(#sm-glow)"/>
    <circle cx="-260" cy="90" r="10" fill="#ffffff"/>

    <!-- Thrusters -->
    <polygon points="100,5 160,-5 100,-15" fill="#38bdf8" filter="url(#sm-glow)"/>
    <polygon points="100,45 160,35 100,25" fill="#38bdf8" filter="url(#sm-glow)"/>

    <!-- Ship Body -->
    <polygon points="-80,20 -40,-35 60,-40 100,-20 100,60 60,80 -40,75" fill="#f59e0b" stroke="#d97706" stroke-width="3"/>
    
    <!-- Armored Cockpit Dome -->
    <circle cx="0" cy="20" r="28" fill="#0284c7" stroke="#38bdf8" stroke-width="3" filter="url(#sm-glow)"/>
    
    <!-- Mining Claw Arm -->
    <path d="M -60 -15 L -100 -30 L -120 -10" stroke="#64748b" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M -60 55 L -100 70 L -120 50" stroke="#64748b" stroke-width="6" stroke-linecap="round" fill="none"/>
    
    <!-- Cargo Pod Glowing Minerals -->
    <rect x="35" y="0" width="40" height="40" rx="4" fill="#0369a1" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="55" cy="20" r="12" fill="#00ffff" filter="url(#sm-glow)"/>
  </g>

  <!-- Titles -->
  <text x="30" y="45" font-family="'Orbitron', sans-serif" font-weight="800" font-size="20" fill="#38bdf8" letter-spacing="3">SPACE MINER</text>
  <text x="30" y="70" font-family="'Chakra Petch', sans-serif" font-weight="600" font-size="12" fill="#fbbf24" letter-spacing="4">ASTEROID CRYSTAL HARVEST</text>
  <rect x="690" y="30" width="80" height="24" rx="4" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="730" y="46" font-family="'Orbitron', sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">ARCADE</text>
</svg>
