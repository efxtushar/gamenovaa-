<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cd-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#3a506b"/>
    </linearGradient>
    <linearGradient id="cd-magic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="cd-blast" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <filter id="cd-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Midnight Siege Sky -->
  <rect width="800" height="450" fill="url(#cd-sky)"/>

  <!-- Burning Catapult Fireballs in Night Sky -->
  <circle cx="580" cy="110" r="16" fill="url(#cd-blast)" filter="url(#cd-glow)"/>
  <circle cx="680" cy="70" r="22" fill="url(#cd-blast)" filter="url(#cd-glow)"/>

  <!-- Field & Battlefield Ground -->
  <rect x="0" y="300" width="800" height="150" fill="#1b281f"/>
  <polygon points="340,300 800,300 800,450 300,450" fill="#2d3748"/>

  <!-- IMPENETRABLE STONE CASTLE & BATTLEMENTS (Left Half) -->
  <g fill="#334155" stroke="#1e293b" stroke-width="3">
    <!-- Main Wall -->
    <rect x="-20" y="160" width="360" height="240"/>
    <!-- Turret 1 (Back) -->
    <rect x="20" y="90" width="80" height="180"/>
    <polygon points="10,90 60,30 110,90" fill="#1e1b4b"/>
    <!-- Turret 2 (Front High Gatehouse) -->
    <rect x="220" y="70" width="100" height="230"/>
    <polygon points="210,70 270,10 330,70" fill="#1e1b4b"/>
    <!-- Crenellations / Merlons -->
    <rect x="100" y="140" width="25" height="25"/>
    <rect x="140" y="140" width="25" height="25"/>
    <rect x="180" y="140" width="25" height="25"/>
  </g>

  <!-- Blue & Gold Royal Banners -->
  <polygon points="270,70 255,140 270,125 285,140" fill="#2563eb" stroke="#facc15" stroke-width="2"/>

  <!-- ARCHER & WIZARD DEFENDERS ON RAMPARTS (Left Stage) -->
  <!-- Arcane Wizard Casting Spells -->
  <g transform="translate(160, 120)">
    <path d="M-15,10 L-25,50 L25,50 L15,10 Z" fill="#6366f1"/>
    <!-- Wizard Hat -->
    <circle cx="0" cy="-6" r="10" fill="#fbcfe8"/>
    <polygon points="-16,-10 0,-40 16,-10" fill="#4338ca"/>
    <!-- Glowing Staff & Big Arcane Energy Blast -->
    <line x1="12" y1="-30" x2="12" y2="40" stroke="#78350f" stroke-width="4"/>
    <circle cx="12" cy="-30" r="12" fill="#38bdf8" filter="url(#cd-glow)"/>
    <!-- Magic Beam Stream Shooting Towards Enemy Horde -->
    <path d="M20,-30 Q220,-80 440,160" stroke="url(#cd-magic)" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#cd-glow)"/>
  </g>

  <!-- Expert Archer Aiming Golden Bow -->
  <g transform="translate(260, 60)">
    <rect x="-10" y="0" width="20" height="35" rx="3" fill="#15803d"/>
    <circle cx="0" cy="-12" r="9" fill="#fbcfe8"/>
    <!-- Bow & Glowing Arrow -->
    <path d="M15,-20 Q35,0 15,20" stroke="#78350f" stroke-width="4" fill="none"/>
    <line x1="5" y1="0" x2="35" y2="0" stroke="#facc15" stroke-width="4" filter="url(#cd-glow)"/>
  </g>

  <!-- GOBLIN & ORC SIEGE HORDE ADVANCING (Right Battlefield) -->
  <!-- Catapult Siege Machine (Right) -->
  <g transform="translate(680, 270)">
    <rect x="-40" y="0" width="80" height="25" fill="#78350f" stroke="#451a03" stroke-width="2"/>
    <circle cx="-25" cy="25" r="15" fill="#451a03"/>
    <circle cx="25" cy="25" r="15" fill="#451a03"/>
    <line x1="-30" y1="5" x2="20" y2="-55" stroke="#78350f" stroke-width="7"/>
    <circle cx="20" cy="-55" r="14" fill="#ea580c" filter="url(#cd-glow)"/>
  </g>

  <!-- Orc / Goblin Warriors with Spiked Axes & Torches -->
  <g transform="translate(480, 280)">
    <circle cx="0" cy="-15" r="12" fill="#15803d"/> <!-- Green skin -->
    <polygon points="-8,-25 -14,-35 -4,-25" fill="#ffffff"/> <!-- Helmet Horn -->
    <polygon points="8,-25 14,-35 4,-25" fill="#ffffff"/>
    <rect x="-10" y="-3" width="20" height="28" fill="#78350f"/>
    <!-- Spiked Iron Mace Raised -->
    <line x1="8" y1="0" x2="30" y2="-25" stroke="#475569" stroke-width="5"/>
    <circle cx="30" cy="-25" r="9" fill="#1e293b"/>
  </g>
  <g transform="translate(560, 295)">
    <circle cx="0" cy="-15" r="12" fill="#15803d"/>
    <rect x="-10" y="-3" width="20" height="28" fill="#78350f"/>
    <line x1="-8" y1="0" x2="-30" y2="-20" stroke="#f59e0b" stroke-width="4"/> <!-- Torch -->
    <circle cx="-30" cy="-20" r="8" fill="#ef4444" filter="url(#cd-glow)"/>
  </g>
</svg>
