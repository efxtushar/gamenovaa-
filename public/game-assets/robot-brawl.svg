<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="rb-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090514"/>
      <stop offset="60%" stop-color="#190729"/>
      <stop offset="100%" stop-color="#020108"/>
    </linearGradient>
    <radialGradient id="rb-spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#00f0ff"/>
      <stop offset="70%" stop-color="#ff0055"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="rb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Cybernetic Underground Arena -->
  <rect width="800" height="450" fill="url(#rb-bg)"/>

  <!-- Arena Steel Grids & Neon Spotlights -->
  <line x1="0" y1="300" x2="800" y2="300" stroke="#ff007f" stroke-width="3" filter="url(#rb-glow)"/>
  <rect x="0" y="300" width="800" height="150" fill="#0c0717"/>

  <!-- Arena Ring Ropes & Cables -->
  <line x1="0" y1="180" x2="800" y2="180" stroke="#00f0ff" stroke-width="2" stroke-dasharray="6,8" opacity="0.6"/>
  <line x1="0" y1="240" x2="800" y2="240" stroke="#00f0ff" stroke-width="2" stroke-dasharray="6,8" opacity="0.6"/>

  <!-- CENTRAL IMPACT SPARK EXPLOSION (Between the two fighting robots) -->
  <circle cx="400" cy="220" r="70" fill="url(#rb-spark)" filter="url(#rb-glow)"/>
  <circle cx="400" cy="220" r="25" fill="#ffffff" filter="url(#rb-glow)"/>
  <!-- Sparks Flying Out -->
  <line x1="400" y1="220" x2="330" y2="150" stroke="#facc15" stroke-width="4" stroke-linecap="round"/>
  <line x1="400" y1="220" x2="480" y2="160" stroke="#00f0ff" stroke-width="4" stroke-linecap="round"/>
  <line x1="400" y1="220" x2="350" y2="290" stroke="#ff007f" stroke-width="4" stroke-linecap="round"/>
  <line x1="400" y1="220" x2="460" y2="280" stroke="#facc15" stroke-width="4" stroke-linecap="round"/>

  <!-- BLUE COMBAT MECH (Player Hero - Punching Right) -->
  <g transform="translate(240, 240)">
    <!-- Shadow -->
    <ellipse cx="0" cy="90" rx="60" ry="14" fill="#000000" opacity="0.8"/>

    <!-- Heavy Legs in Wide Combat Stance -->
    <path d="M-20,30 L-50,70 L-70,90" stroke="#1e293b" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M-20,30 L-50,70 L-70,90" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M20,30 L40,65 L55,90" stroke="#1e293b" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M20,30 L40,65 L55,90" stroke="#00f0ff" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- Steel Chassis & Glowing Power Core -->
    <path d="M-35,-30 L35,-30 L25,35 L-25,35 Z" fill="#0284c7" stroke="#0369a1" stroke-width="3"/>
    <circle cx="0" cy="5" r="14" fill="#00f0ff" filter="url(#rb-glow)"/>

    <!-- Armored Head with Cyan Visor -->
    <rect x="-18" y="-55" width="36" height="24" rx="4" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
    <rect x="-12" y="-46" width="24" height="6" fill="#00f0ff" filter="url(#rb-glow)"/>

    <!-- Left Guard Arm & MASSIVE RIGHT ROCKET PUNCH EXTENDING FORWARD -->
    <path d="M-30,-20 L-60,0 L-40,25" stroke="#0284c7" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- Rocket Arm Punching Right with Thruster Flame -->
    <path d="M30,-20 L100,-20 L155,-20" stroke="#0284c7" stroke-width="18" stroke-linecap="round" fill="none"/>
    <rect x="140" y="-35" width="35" height="30" rx="6" fill="#0f172a" stroke="#00f0ff" stroke-width="3"/> <!-- Fist -->
  </g>

  <!-- RED TITAN MECH (Rival Opponent - Bracing / Countering) -->
  <g transform="translate(560, 240)">
    <!-- Shadow -->
    <ellipse cx="0" cy="90" rx="60" ry="14" fill="#000000" opacity="0.8"/>

    <!-- Heavy Legs -->
    <path d="M-20,30 L-35,65 L-50,90" stroke="#1c1917" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M20,30 L50,70 L70,90" stroke="#1c1917" stroke-width="18" stroke-linecap="round" fill="none"/>

    <!-- Red Spiked Chassis & Core -->
    <path d="M-35,-30 L35,-30 L25,35 L-25,35 Z" fill="#dc2626" stroke="#991b1b" stroke-width="3"/>
    <circle cx="0" cy="5" r="14" fill="#ef4444" filter="url(#rb-glow)"/>

    <!-- Horned Heavy Helmet with Red Glow -->
    <polygon points="-22,-30 -35,-65 0,-45 35,-65 22,-30" fill="#7f1d1d" stroke="#ef4444" stroke-width="2"/>
    <rect x="-12" y="-44" width="24" height="6" fill="#facc15" filter="url(#rb-glow)"/>

    <!-- Heavy Spiked Shield Arm blocking the punch -->
    <path d="M-30,-20 L-100,-20" stroke="#dc2626" stroke-width="18" stroke-linecap="round" fill="none"/>
    <polygon points="-110,-55 -85,-20 -110,15" fill="#f59e0b" filter="url(#rb-glow)"/>
  </g>
</svg>
