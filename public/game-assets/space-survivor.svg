<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ss-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#02030f"/>
      <stop offset="50%" stop-color="#11052c"/>
      <stop offset="100%" stop-color="#240316"/>
    </linearGradient>
    <radialGradient id="ss-shield" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="70%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0.8"/>
    </radialGradient>
    <filter id="ss-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#ss-bg)"/>

  <!-- Orbital Weapon Shield Ring around Player -->
  <circle cx="400" cy="240" r="120" fill="url(#ss-shield)"/>
  <circle cx="400" cy="240" r="120" fill="none" stroke="#00ffff" stroke-width="2" stroke-dasharray="14,8" opacity="0.8" filter="url(#ss-glow)"/>

  <!-- 4 Orbiting Weapon Drones / Plasma Blades -->
  <circle cx="280" cy="240" r="10" fill="#00ffff" stroke="#ffffff" stroke-width="2" filter="url(#ss-glow)"/>
  <circle cx="520" cy="240" r="10" fill="#00ffff" stroke="#ffffff" stroke-width="2" filter="url(#ss-glow)"/>
  <circle cx="400" cy="120" r="10" fill="#00ffff" stroke="#ffffff" stroke-width="2" filter="url(#ss-glow)"/>
  <circle cx="400" cy="360" r="10" fill="#00ffff" stroke="#ffffff" stroke-width="2" filter="url(#ss-glow)"/>

  <!-- 360-Degree Laser Burst Volleys (Bullet Hell Style) -->
  <line x1="400" y1="240" x2="160" y2="90" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" filter="url(#ss-glow)"/>
  <line x1="400" y1="240" x2="640" y2="100" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" filter="url(#ss-glow)"/>
  <line x1="400" y1="240" x2="660" y2="360" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" filter="url(#ss-glow)"/>
  <line x1="400" y1="240" x2="150" y2="350" stroke="#f43f5e" stroke-width="4" stroke-linecap="round" filter="url(#ss-glow)"/>

  <!-- Alien Drone Swarms Surrounding Ship -->
  <!-- Alien 1 -->
  <g transform="translate(180, 110)">
    <polygon points="0,-16 20,12 -20,12" fill="#9333ea" stroke="#c084fc" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#f43f5e" filter="url(#ss-glow)"/>
  </g>
  <!-- Alien 2 -->
  <g transform="translate(620, 120)">
    <polygon points="0,-16 20,12 -20,12" fill="#9333ea" stroke="#c084fc" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#f43f5e" filter="url(#ss-glow)"/>
  </g>
  <!-- Alien 3 -->
  <g transform="translate(640, 340)">
    <polygon points="0,-16 20,12 -20,12" fill="#9333ea" stroke="#c084fc" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#f43f5e" filter="url(#ss-glow)"/>
  </g>
  <!-- Alien 4 -->
  <g transform="translate(160, 330)">
    <polygon points="0,-16 20,12 -20,12" fill="#9333ea" stroke="#c084fc" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#f43f5e" filter="url(#ss-glow)"/>
  </g>

  <!-- Player Flagship (Center Survivor) -->
  <g transform="translate(400, 240)">
    <!-- Ship Hull -->
    <polygon points="0,-45 32,25 18,35 0,20 -18,35 -32,25" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
    <polygon points="0,-35 20,20 0,10 -20,20" fill="#f8fafc"/>
    <circle cx="0" cy="-5" r="10" fill="#00ffff" filter="url(#ss-glow)"/>
  </g>

  <!-- Titles -->
  <text x="30" y="45" font-family="'Orbitron', sans-serif" font-weight="800" font-size="20" fill="#38bdf8" letter-spacing="3">SPACE SURVIVOR</text>
  <text x="30" y="70" font-family="'Chakra Petch', sans-serif" font-weight="600" font-size="12" fill="#f43f5e" letter-spacing="4">BULLET HEAVEN ROGUELITE</text>
  <rect x="670" y="30" width="100" height="24" rx="4" fill="#1e1b4b" fill-opacity="0.2" stroke="#a855f7" stroke-width="1.5"/>
  <text x="720" y="46" font-family="'Orbitron', sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">ACTION</text>
</svg>
