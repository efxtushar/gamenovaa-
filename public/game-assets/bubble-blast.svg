<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bb-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f051d"/>
      <stop offset="50%" stop-color="#2d0a4e"/>
      <stop offset="100%" stop-color="#080214"/>
    </linearGradient>
    <radialGradient id="bubble-pink" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#f472b6"/>
      <stop offset="85%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#831843"/>
    </radialGradient>
    <radialGradient id="bubble-cyan" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#67e8f9"/>
      <stop offset="85%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </radialGradient>
    <radialGradient id="bubble-yellow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#fef08a"/>
      <stop offset="85%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </radialGradient>
    <radialGradient id="bubble-purple" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#d8b4fe"/>
      <stop offset="85%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </radialGradient>
    <filter id="bb-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bb-bg)"/>

  <!-- Geometric Arcade Hexagon Grid Overlay -->
  <polygon points="120,60 160,80 160,120 120,140 80,120 80,80" fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.3"/>
  <polygon points="680,80 720,100 720,140 680,160 640,140 640,100" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.3"/>

  <!-- Bubble Clusters (Top Wall) -->
  <circle cx="280" cy="110" r="32" fill="url(#bubble-cyan)"/>
  <circle cx="340" cy="110" r="32" fill="url(#bubble-pink)"/>
  <circle cx="400" cy="110" r="32" fill="url(#bubble-yellow)"/>
  <circle cx="460" cy="110" r="32" fill="url(#bubble-pink)"/>
  <circle cx="520" cy="110" r="32" fill="url(#bubble-cyan)"/>

  <circle cx="310" cy="160" r="32" fill="url(#bubble-pink)"/>
  <circle cx="370" cy="160" r="32" fill="url(#bubble-purple)"/>
  <circle cx="430" cy="160" r="32" fill="url(#bubble-purple)"/>
  <circle cx="490" cy="160" r="32" fill="url(#bubble-yellow)"/>

  <circle cx="340" cy="210" r="32" fill="url(#bubble-cyan)"/>
  <circle cx="400" cy="210" r="32" fill="url(#bubble-pink)"/>
  <circle cx="460" cy="210" r="32" fill="url(#bubble-cyan)"/>

  <!-- Exploding / Popping Bubble in Center with Sparks -->
  <g transform="translate(400, 210)">
    <!-- Pop shockwave ring -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#f472b6" stroke-width="3" opacity="0.7" filter="url(#bb-glow)"/>
    <line x1="-35" y1="-35" x2="-60" y2="-60" stroke="#f472b6" stroke-width="4" stroke-linecap="round"/>
    <line x1="35" y1="-35" x2="60" y2="-60" stroke="#f472b6" stroke-width="4" stroke-linecap="round"/>
    <line x1="-35" y1="35" x2="-60" y2="60" stroke="#67e8f9" stroke-width="4" stroke-linecap="round"/>
    <line x1="35" y1="35" x2="60" y2="60" stroke="#67e8f9" stroke-width="4" stroke-linecap="round"/>
    <!-- Popping particles -->
    <circle cx="-25" cy="-20" r="5" fill="#fde047" filter="url(#bb-glow)"/>
    <circle cx="30" cy="-22" r="6" fill="#67e8f9" filter="url(#bb-glow)"/>
    <circle cx="0" cy="35" r="7" fill="#f472b6" filter="url(#bb-glow)"/>
  </g>

  <!-- Bubble Cannon Launcher at Bottom -->
  <g transform="translate(400, 390)">
    <!-- Base Platform -->
    <path d="M -70 30 L 70 30 L 50 0 L -50 0 Z" fill="#1e1b4b" stroke="#7c3aed" stroke-width="2"/>
    <!-- Swiveling Turret Barrel -->
    <g transform="rotate(-15)">
      <rect x="-18" y="-70" width="36" height="70" rx="6" fill="#312e81" stroke="#a855f7" stroke-width="2"/>
      <!-- Loaded Bubble in Chamber -->
      <circle cx="0" cy="-45" r="24" fill="url(#bubble-pink)"/>
      <!-- Laser Sight Pointer -->
      <line x1="0" y1="-70" x2="0" y2="-180" stroke="#f472b6" stroke-width="2" stroke-dasharray="6,6" opacity="0.8" filter="url(#bb-glow)"/>
    </g>
  </g>

  <!-- Titles -->
  <text x="30" y="45" font-family="'Orbitron', sans-serif" font-weight="800" font-size="20" fill="#f472b6" letter-spacing="3">BUBBLE BLAST</text>
  <text x="30" y="70" font-family="'Chakra Petch', sans-serif" font-weight="600" font-size="12" fill="#67e8f9" letter-spacing="4">POP &amp; MATCH PUZZLE</text>
  <rect x="690" y="30" width="80" height="24" rx="4" fill="#a855f7" fill-opacity="0.2" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="730" y="46" font-family="'Orbitron', sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">PUZZLE</text>
</svg>
