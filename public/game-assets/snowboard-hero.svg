<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="snowSlope" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#snowSlope)" />
  <!-- Alpine Pine Trees -->
  <g transform="translate(100, 140)">
    <polygon points="0,-40 -25,10 25,10" fill="#0f766e" />
    <polygon points="0,-20 -30,30 30,30" fill="#115e59" />
    <rect x="-5" y="30" width="10" height="15" fill="#78350f" />
  </g>
  <g transform="translate(520, 220)">
    <polygon points="0,-40 -25,10 25,10" fill="#0f766e" />
    <polygon points="0,-20 -30,30 30,30" fill="#115e59" />
  </g>
  <!-- Snowboarder jumping off kicker ramp -->
  <g transform="translate(320, 150) rotate(-25)">
    <!-- Snowboard -->
    <rect x="-55" y="20" width="110" height="14" rx="7" fill="#ef4444" stroke="#991b1b" stroke-width="2" />
    <!-- Rider -->
    <circle cx="0" cy="-30" r="18" fill="#0284c7" />
    <rect x="-8" y="-35" width="20" height="8" fill="#facc15" />
    <path d="M-15,-12 L0,20 L15,-12 Z" fill="#0369a1" />
  </g>
</svg>
