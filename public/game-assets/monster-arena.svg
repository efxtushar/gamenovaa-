<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ma-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#180404"/>
      <stop offset="50%" stop-color="#450a0a"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
    <radialGradient id="ma-flame" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0"/>
    </radialGradient>
    <filter id="ma-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Blood Red Colosseum Sky -->
  <rect width="800" height="450" fill="url(#ma-sky)"/>

  <!-- Roman / Fantasy Colosseum Arches & Pillars -->
  <g fill="#271010" stroke="#450a0a" stroke-width="2">
    <rect x="40" y="80" width="720" height="40" rx="4"/>
    <rect x="60" y="120" width="45" height="140"/>
    <rect x="140" y="120" width="45" height="140"/>
    <rect x="220" y="120" width="45" height="140"/>
    <rect x="540" y="120" width="45" height="140"/>
    <rect x="620" y="120" width="45" height="140"/>
    <rect x="700" y="120" width="45" height="140"/>
  </g>

  <!-- Torches along Colosseum Walls -->
  <circle cx="82" cy="115" r="16" fill="url(#ma-flame)" filter="url(#ma-glow)"/>
  <circle cx="242" cy="115" r="16" fill="url(#ma-flame)" filter="url(#ma-glow)"/>
  <circle cx="562" cy="115" r="16" fill="url(#ma-flame)" filter="url(#ma-glow)"/>
  <circle cx="722" cy="115" r="16" fill="url(#ma-flame)" filter="url(#ma-glow)"/>

  <!-- Sand Arena Pit Floor -->
  <rect x="0" y="270" width="800" height="180" fill="#78350f"/>
  <ellipse cx="400" cy="360" rx="390" ry="80" fill="#92400e"/>

  <!-- GIANT INFERNAL GOLEM / HYDRA MONSTER BOSS (Right Side Dominating Screen) -->
  <g transform="translate(560, 220)">
    <!-- Molten Magma Torso & Rocky Plates -->
    <path d="M-80,-60 L80,-60 L60,80 L-60,80 Z" fill="#1c1917" stroke="#f97316" stroke-width="4"/>
    <!-- Glowing Lava Cracks in Chest -->
    <path d="M-40,-30 Q0,0 -30,40" stroke="#facc15" stroke-width="6" fill="none" filter="url(#ma-glow)"/>
    <path d="M30,-40 Q-10,-10 25,30" stroke="#f97316" stroke-width="6" fill="none" filter="url(#ma-glow)"/>

    <!-- Massive Golem Head & Horns -->
    <polygon points="-45,-60 0,-120 45,-60" fill="#292524" stroke="#f97316" stroke-width="3"/>
    <!-- Horns -->
    <polygon points="-30,-110 -75,-160 -15,-120" fill="#44403c"/>
    <polygon points="30,-110 75,-160 15,-120" fill="#44403c"/>
    <!-- Burning Fiery Eyes & Mouth -->
    <circle cx="-16" cy="-80" r="8" fill="#facc15" filter="url(#ma-glow)"/>
    <circle cx="16" cy="-80" r="8" fill="#facc15" filter="url(#ma-glow)"/>
    <rect x="-18" y="-60" width="36" height="10" rx="3" fill="#f97316" filter="url(#ma-glow)"/>

    <!-- Huge Spiked Stone Fist Slamming Down (Sparks & Shockwave) -->
    <g transform="translate(-110, 40) rotate(-20)">
      <circle cx="0" cy="0" r="42" fill="#292524" stroke="#f97316" stroke-width="4"/>
      <polygon points="-35,-20 -60,-10 -30,0" fill="#f59e0b"/>
      <polygon points="35,-20 60,-10 30,0" fill="#f59e0b"/>
      <!-- Shockwave -->
      <ellipse cx="0" cy="45" rx="60" ry="16" fill="#f97316" opacity="0.6" filter="url(#ma-glow)"/>
    </g>
  </g>

  <!-- GLADIATOR WARRIOR HERO (Left Side Heroic Stance) -->
  <g transform="translate(240, 260)">
    <!-- Shadow -->
    <ellipse cx="0" cy="85" rx="45" ry="14" fill="#000000" opacity="0.7"/>

    <!-- Golden Spartan Armor & Red Cape -->
    <path d="M-15,-15 Q-70,-5 -100,25 Q-65,45 -10,30 Z" fill="#dc2626"/>
    <!-- Golden Torso Cuirass -->
    <path d="M-18,-20 L18,-20 L14,30 L-14,30 Z" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
    <!-- Pteruges (Armor skirt) -->
    <rect x="-14" y="30" width="28" height="18" fill="#78350f"/>

    <!-- Legs & Greaves -->
    <path d="M-12,35 L-30,65 L-40,85" stroke="#eab308" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M12,35 L28,65 L40,85" stroke="#eab308" stroke-width="10" stroke-linecap="round" fill="none"/>

    <!-- Corinthian Helmet with Red Crest -->
    <circle cx="0" cy="-42" r="18" fill="#eab308" stroke="#ca8a04" stroke-width="2"/>
    <path d="M-6,-60 Q0,-75 25,-55 Q10,-45 -4,-45 Z" fill="#dc2626"/>
    <rect x="-8" y="-44" width="16" height="6" fill="#000000"/>

    <!-- ROUND GOLDEN SHIELD (Bracing Against Shockwave) -->
    <ellipse cx="-28" cy="5" rx="26" ry="34" fill="#ca8a04" stroke="#eab308" stroke-width="4"/>
    <circle cx="-28" cy="5" r="10" fill="#eab308"/>

    <!-- ENCHANTED BROADSWORD (Glowing Blue Sparkles) -->
    <line x1="20" y1="5" x2="85" y2="-55" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" filter="url(#ma-glow)"/>
    <line x1="20" y1="5" x2="85" y2="-55" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="20" cy="5" r="8" fill="#eab308"/>
  </g>
</svg>
