<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="pt-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#022c43"/>
      <stop offset="40%" stop-color="#05445e"/>
      <stop offset="75%" stop-color="#189ab4"/>
      <stop offset="100%" stop-color="#d4f1f4"/>
    </linearGradient>
    <linearGradient id="pt-sea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05445e"/>
      <stop offset="50%" stop-color="#022c43"/>
      <stop offset="100%" stop-color="#011627"/>
    </linearGradient>
    <radialGradient id="pt-sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="60%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0"/>
    </radialGradient>
    <filter id="pt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Tropical Sunset Sky & Island Sun -->
  <rect width="800" height="450" fill="url(#pt-sky)"/>
  <circle cx="480" cy="180" r="100" fill="url(#pt-sun)"/>

  <!-- Mystic Skull Rock Island (Left Background) -->
  <polygon points="-20,320 80,140 180,180 260,320" fill="#1f2937"/>
  <!-- Skull rock hollow eye sockets -->
  <ellipse cx="100" cy="200" rx="14" ry="18" fill="#030712"/>
  <ellipse cx="150" cy="205" rx="12" ry="16" fill="#030712"/>
  <ellipse cx="125" cy="240" rx="16" ry="8" fill="#030712"/>
  <!-- Palm Trees on Island -->
  <path d="M180,240 Q210,180 230,160" stroke="#78350f" stroke-width="6" fill="none"/>
  <path d="M230,160 Q200,140 170,165" stroke="#15803d" stroke-width="5" fill="none"/>
  <path d="M230,160 Q260,135 285,160" stroke="#15803d" stroke-width="5" fill="none"/>

  <!-- Ocean Waves with Sea Foam -->
  <rect x="0" y="270" width="800" height="180" fill="url(#pt-sea)"/>
  <path d="M0,280 Q200,260 400,280 T800,280 L800,450 L0,450 Z" fill="#05445e" opacity="0.7"/>

  <!-- TROPICAL SANDY SHORE FOREGROUND (Right Corner) -->
  <polygon points="420,450 520,330 800,340 800,450" fill="#eab308"/>
  <polygon points="440,450 540,340 800,350 800,450" fill="#ca8a04"/>

  <!-- OVERFLOWING PIRATE TREASURE CHEST (Gems, Coins, Gold) -->
  <g transform="translate(620, 320)">
    <!-- Shadow -->
    <ellipse cx="25" cy="55" rx="45" ry="14" fill="#000000" opacity="0.6"/>
    <!-- Open Wooden Chest Base -->
    <rect x="-15" y="10" width="80" height="45" rx="6" fill="#78350f" stroke="#451a03" stroke-width="3"/>
    <!-- Gold bands on chest -->
    <line x1="-15" y1="20" x2="65" y2="20" stroke="#eab308" stroke-width="3"/>
    <line x1="-15" y1="40" x2="65" y2="40" stroke="#eab308" stroke-width="3"/>
    <!-- Open Lid Raised -->
    <path d="M-18,10 Q25,-30 68,10" stroke="#78350f" stroke-width="12" fill="none"/>
    <circle cx="25" cy="-10" r="10" fill="#eab308" filter="url(#pt-glow)"/>
    <!-- Glowing Gold Coins & Ruby / Emerald Gems -->
    <circle cx="5" cy="5" r="8" fill="#fbbf24" filter="url(#pt-glow)"/>
    <circle cx="25" cy="0" r="10" fill="#ef4444" filter="url(#pt-glow)"/>
    <circle cx="45" cy="6" r="9" fill="#10b981" filter="url(#pt-glow)"/>
    <circle cx="20" cy="12" r="7" fill="#38bdf8" filter="url(#pt-glow)"/>
  </g>

  <!-- PIRATE CAPTAIN CHARACTER (With Cutlass & Tricorne Hat) -->
  <g transform="translate(480, 270)">
    <!-- Shadow -->
    <ellipse cx="0" cy="115" rx="35" ry="12" fill="#000000" opacity="0.7"/>

    <!-- Red Pirate Captain Coat -->
    <path d="M-25,15 L-40,85 L40,85 L25,15 Z" fill="#991b1b" stroke="#7f1d1d" stroke-width="2"/>
    <rect x="-15" y="15" width="30" height="60" fill="#f8fafc"/> <!-- White Ruffled Shirt -->
    <!-- Gold Buttons & Belt -->
    <rect x="-26" y="55" width="52" height="10" rx="2" fill="#451a03"/>
    <rect x="-8" y="52" width="16" height="16" rx="2" fill="#eab308" stroke="#78350f" stroke-width="2"/>

    <!-- Boots & Peg Leg -->
    <path d="M-15,85 L-18,115" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
    <path d="M15,85 L18,115" stroke="#78350f" stroke-width="8" stroke-linecap="round"/> <!-- Wooden Peg Leg -->

    <!-- Head, Beard & Eye Patch -->
    <circle cx="0" cy="-10" r="18" fill="#fbcfe8"/>
    <!-- Black Beard -->
    <path d="M-14,-6 Q0,25 14,-6 Z" fill="#18181b"/>
    <!-- Eye Patch Strap -->
    <line x1="-15" y1="-14" x2="15" y2="-8" stroke="#18181b" stroke-width="3"/>
    <circle cx="-5" cy="-12" r="4" fill="#18181b"/>

    <!-- Pirate Tricorne Hat with Feather -->
    <polygon points="-38,-20 0,-48 38,-20" fill="#18181b" stroke="#eab308" stroke-width="2"/>
    <path d="M-10,-40 Q-40,-60 -55,-40" stroke="#dc2626" stroke-width="5" stroke-linecap="round" fill="none"/>

    <!-- Cutlass Sword Raised High (Action Pose) -->
    <line x1="25" y1="20" x2="65" y2="-40" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" filter="url(#pt-glow)"/>
    <circle cx="28" cy="20" r="6" fill="#eab308"/>
  </g>

  <!-- GRAND PIRATE GALLEON SHIP (Sailing Ocean with Black Sails & Cannons) -->
  <g transform="translate(220, 240)">
    <!-- Wooden Ship Hull -->
    <path d="M-90,10 L90,10 L70,50 L-70,50 Z" fill="#451a03" stroke="#290e03" stroke-width="3"/>
    <!-- Bowsprit Spike -->
    <line x1="90" y1="10" x2="135" y2="-10" stroke="#78350f" stroke-width="4"/>

    <!-- 3 Tall Masts -->
    <line x1="-45" y1="10" x2="-45" y2="-110" stroke="#78350f" stroke-width="5"/>
    <line x1="15" y1="10" x2="15" y2="-140" stroke="#78350f" stroke-width="6"/>
    <line x1="60" y1="10" x2="60" y2="-90" stroke="#78350f" stroke-width="4"/>

    <!-- Black Sails with White Skull Crossbones -->
    <!-- Main Sail -->
    <path d="M-15,-40 L45,-40 L35,-100 L-5,-100 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <circle cx="15" cy="-70" r="8" fill="#f8fafc"/>
    <!-- Fore Sail -->
    <path d="M-65,-30 L-25,-30 L-30,-80 L-60,-80 Z" fill="#0f172a" stroke="#334155" stroke-width="2"/>

    <!-- Jolly Roger Pirate Flag Top Mast -->
    <rect x="15" y="-150" width="28" height="16" fill="#000000"/>
    <circle cx="28" cy="-142" r="3" fill="#ffffff"/>

    <!-- Cannon Firing Burst (Orange Fire & Smoke) -->
    <circle cx="75" cy="25" r="14" fill="#f97316" filter="url(#pt-glow)"/>
    <circle cx="95" cy="22" r="8" fill="#fef08a" filter="url(#pt-glow)"/>
    <ellipse cx="110" cy="20" rx="20" ry="12" fill="#94a3b8" opacity="0.7"/>
  </g>
</svg>
