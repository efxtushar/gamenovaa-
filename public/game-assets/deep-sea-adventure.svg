<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="dsa-depth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#02131d"/>
      <stop offset="50%" stop-color="#032539"/>
      <stop offset="100%" stop-color="#01080e"/>
    </linearGradient>
    <radialGradient id="dsa-lantern" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#00f0ff"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="dsa-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep Abyssal Trench Ocean -->
  <rect width="800" height="450" fill="url(#dsa-depth)"/>

  <!-- Bioluminescent Particles Floating -->
  <circle cx="120" cy="180" r="3" fill="#00f0ff" filter="url(#dsa-glow)"/>
  <circle cx="280" cy="90" r="4" fill="#a855f7" filter="url(#dsa-glow)"/>
  <circle cx="480" cy="310" r="3" fill="#34d399" filter="url(#dsa-glow)"/>
  <circle cx="680" cy="140" r="5" fill="#facc15" filter="url(#dsa-glow)"/>

  <!-- Sunken Atlantis Ruins & Coral Trench Formations -->
  <polygon points="-20,450 140,320 220,450" fill="#041a24"/>
  <polygon points="180,450 260,340 340,450" fill="#052230"/>
  <polygon points="560,450 680,290 820,450" fill="#031520"/>
  <!-- Ancient Sunken Pillar -->
  <rect x="180" y="320" width="30" height="90" fill="#0c4a6e" opacity="0.6"/>

  <!-- GIANT BIOLUMINESCENT ANGLERFISH (Right Stalking Danger) -->
  <g transform="translate(620, 240)">
    <!-- Bioluminescent Esca / Glowing Lure Antenna High Above -->
    <path d="M-40,-35 Q-110,-120 -140,-40" stroke="#00f0ff" stroke-width="4" fill="none" filter="url(#dsa-glow)"/>
    <circle cx="-140" cy="-40" r="18" fill="url(#dsa-lantern)" filter="url(#dsa-glow)"/>
    <circle cx="-140" cy="-40" r="7" fill="#ffffff"/>

    <!-- Massive Abyssal Fish Body -->
    <ellipse cx="0" cy="0" rx="90" ry="65" fill="#0f172a" stroke="#1e293b" stroke-width="3"/>
    <!-- Giant Jaw with Razor Sharp Translucent Teeth -->
    <path d="M-60,10 L-95,-15 L-60,-40" stroke="#f8fafc" stroke-width="4" fill="none"/>
    <line x1="-90" y1="-10" x2="-80" y2="5" stroke="#ffffff" stroke-width="3"/>
    <line x1="-80" y1="-20" x2="-70" y2="-5" stroke="#ffffff" stroke-width="3"/>
    <line x1="-70" y1="-30" x2="-60" y2="-15" stroke="#ffffff" stroke-width="3"/>

    <!-- Glowing Violet Eyes -->
    <circle cx="-40" cy="-25" r="10" fill="#c084fc" filter="url(#dsa-glow)"/>
  </g>

  <!-- DEEP SEA SUBMERSIBLE & SCUBA DIVER HERO (Left Center Action) -->
  <g transform="translate(260, 220)">
    <!-- Yellow Submarine Body -->
    <ellipse cx="0" cy="0" rx="90" ry="50" fill="#eab308" stroke="#ca8a04" stroke-width="3"/>
    <rect x="-15" y="-65" width="30" height="20" rx="4" fill="#ca8a04"/> <!-- Conning tower -->

    <!-- Large Front Bubble Cockpit Window with Pilot -->
    <circle cx="50" cy="0" r="32" fill="#38bdf8" opacity="0.8" stroke="#ffffff" stroke-width="3"/>
    <!-- Glowing Searchlight Beam Illuminating the Trench Abyss -->
    <polygon points="75,-15 500,-110 520,130 75,15" fill="#fef08a" opacity="0.3" filter="url(#dsa-glow)"/>

    <!-- Mechanical Robotic Sample Arm -->
    <path d="M40,30 L75,65 L100,50" stroke="#475569" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="100" cy="50" r="8" fill="#eab308"/>

    <!-- Back Propeller with Water Vortex -->
    <rect x="-95" y="-12" width="10" height="24" fill="#475569"/>
    <ellipse cx="-110" cy="0" rx="12" ry="24" fill="#38bdf8" opacity="0.6"/>
  </g>
</svg>
