<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="pq-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090514"/>
      <stop offset="60%" stop-color="#180b2b"/>
      <stop offset="100%" stop-color="#2a0845"/>
    </linearGradient>
    <radialGradient id="pq-torch" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="80%" stop-color="#dc2626" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="pq-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dungeon Castle Crypt Background -->
  <rect width="800" height="450" fill="url(#pq-bg)"/>

  <!-- Dungeon Stone Brick Wall Pattern -->
  <g fill="#1e1333" stroke="#0e071c" stroke-width="3">
    <rect x="0" y="60" width="120" height="40"/>
    <rect x="120" y="60" width="160" height="40"/>
    <rect x="280" y="60" width="140" height="40"/>
    <rect x="420" y="60" width="160" height="40"/>
    <rect x="580" y="60" width="120" height="40"/>
    <rect x="700" y="60" width="100" height="40"/>

    <rect x="60" y="100" width="140" height="40"/>
    <rect x="200" y="100" width="160" height="40"/>
    <rect x="360" y="100" width="120" height="40"/>
    <rect x="480" y="100" width="150" height="40"/>
    <rect x="630" y="100" width="170" height="40"/>
  </g>

  <!-- Glowing Dungeon Torches on Wall -->
  <circle cx="160" cy="110" r="28" fill="url(#pq-torch)" filter="url(#pq-glow)"/>
  <rect x="156" y="125" width="8" height="24" fill="#78350f"/>
  <circle cx="640" cy="110" r="28" fill="url(#pq-torch)" filter="url(#pq-glow)"/>
  <rect x="636" y="125" width="8" height="24" fill="#78350f"/>

  <!-- Dungeon Cobblestone Ground -->
  <rect x="0" y="300" width="800" height="150" fill="#0f091c"/>
  <line x1="0" y1="300" x2="800" y2="300" stroke="#f59e0b" stroke-width="3" filter="url(#pq-glow)" opacity="0.6"/>

  <!-- GLOWING TREASURE CHEST & GEMS (Right Floor) -->
  <g transform="translate(620, 310)">
    <rect x="-10" y="0" width="70" height="40" rx="4" fill="#78350f" stroke="#eab308" stroke-width="3"/>
    <circle cx="25" cy="12" r="5" fill="#facc15"/>
    <circle cx="45" cy="-8" r="8" fill="#38bdf8" filter="url(#pq-glow)"/>
    <circle cx="10" cy="-10" r="10" fill="#a855f7" filter="url(#pq-glow)"/>
  </g>

  <!-- FIRE DRAGON BOSS IN DUNGEON (Right Side) -->
  <g transform="translate(520, 200)">
    <ellipse cx="0" cy="0" rx="75" ry="40" fill="#991b1b" stroke="#7f1d1d" stroke-width="3"/>
    <polygon points="-40,-20 -90,-80 -20,-40" fill="#dc2626"/>
    <circle cx="-50" cy="-15" r="7" fill="#facc15" filter="url(#pq-glow)"/>
    <!-- Fire Breath Flame Stream -->
    <path d="M-60,-10 Q-140,-30 -220,20 Q-150,50 -60,0" fill="#f97316" filter="url(#pq-glow)" opacity="0.9"/>
  </g>

  <!-- PIXEL KNIGHT HERO (Left Hero Stance with Sword & Shield) -->
  <g transform="translate(240, 260)">
    <!-- Shadow -->
    <ellipse cx="0" cy="80" rx="45" ry="12" fill="#000000" opacity="0.8"/>

    <!-- Blue Knight Armor & Tunic -->
    <rect x="-20" y="-10" width="40" height="45" rx="4" fill="#2563eb" stroke="#1d4ed8" stroke-width="2"/>
    <rect x="-12" y="35" width="24" height="15" fill="#1e293b"/>

    <!-- Armored Boots -->
    <rect x="-18" y="50" width="14" height="28" fill="#64748b"/>
    <rect x="4" y="50" width="14" height="28" fill="#64748b"/>

    <!-- Helmet & Golden Visor -->
    <rect x="-16" y="-38" width="32" height="28" rx="4" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
    <rect x="-12" y="-28" width="24" height="6" fill="#facc15" filter="url(#pq-glow)"/>
    <polygon points="0,-38 -15,-55 0,-44 15,-55" fill="#dc2626"/> <!-- Red Helmet Feather -->

    <!-- ROYAL LION SHIELD (Blocking Fire Breath) -->
    <rect x="18" y="-15" width="28" height="45" rx="6" fill="#eab308" stroke="#ffffff" stroke-width="2" filter="url(#pq-glow)"/>
    <circle cx="32" cy="7" r="7" fill="#dc2626"/>

    <!-- PIXEL BROADSWORD (Raised Ready for Strike) -->
    <line x1="-15" y1="5" x2="-65" y2="-45" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" filter="url(#pq-glow)"/>
    <line x1="-15" y1="5" x2="-65" y2="-45" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
