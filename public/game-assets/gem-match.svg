<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="gm-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0518"/>
      <stop offset="50%" stop-color="#240c42"/>
      <stop offset="100%" stop-color="#080214"/>
    </linearGradient>
    <radialGradient id="gem-ruby" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#f87171"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
    <radialGradient id="gem-sapphire" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#60a5fa"/>
      <stop offset="70%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>
    <radialGradient id="gem-emerald" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#4ade80"/>
      <stop offset="70%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>
    <radialGradient id="gem-amethyst" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#e879f9"/>
      <stop offset="70%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#701a75"/>
    </radialGradient>
    <radialGradient id="gem-topaz" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#fde047"/>
      <stop offset="70%" stop-color="#ca8a04"/>
      <stop offset="100%" stop-color="#713f12"/>
    </radialGradient>
    <filter id="gm-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#gm-bg)"/>

  <!-- Magic Rune Circle in Center Background -->
  <circle cx="400" cy="240" r="160" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="12,12" opacity="0.6"/>
  <circle cx="400" cy="240" r="130" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.4"/>

  <!-- Sparkling Cascading Gems Grid -->
  <!-- Row 1 -->
  <g transform="translate(240, 160)">
    <!-- Emerald Octagon -->
    <polygon points="-24,-10 -10,-24 10,-24 24,-10 24,10 10,24 -10,24 -24,10" fill="url(#gem-emerald)" stroke="#86efac" stroke-width="2" filter="url(#gm-glow)"/>
  </g>
  <g transform="translate(320, 160)">
    <!-- Ruby Diamond -->
    <polygon points="0,-28 28,0 0,28 -28,0" fill="url(#gem-ruby)" stroke="#fca5a5" stroke-width="2" filter="url(#gm-glow)"/>
  </g>
  <g transform="translate(400, 160)">
    <!-- Sapphire Hexagon -->
    <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="url(#gem-sapphire)" stroke="#93c5fd" stroke-width="2" filter="url(#gm-glow)"/>
  </g>
  <g transform="translate(480, 160)">
    <!-- Topaz Triangle -->
    <polygon points="0,-26 28,22 -28,22" fill="url(#gem-topaz)" stroke="#fef08a" stroke-width="2" filter="url(#gm-glow)"/>
  </g>
  <g transform="translate(560, 160)">
    <!-- Amethyst Heart / Round -->
    <circle cx="0" cy="0" r="24" fill="url(#gem-amethyst)" stroke="#f0abfc" stroke-width="2" filter="url(#gm-glow)"/>
  </g>

  <!-- Row 2 (Combo Explosion in Center) -->
  <g transform="translate(240, 240)">
    <polygon points="0,-28 28,0 0,28 -28,0" fill="url(#gem-ruby)" stroke="#fca5a5" stroke-width="2"/>
  </g>
  <g transform="translate(320, 240)">
    <polygon points="0,-28 28,0 0,28 -28,0" fill="url(#gem-ruby)" stroke="#fca5a5" stroke-width="2"/>
  </g>
  <!-- Center Matched 4-in-a-row Hyper Diamond Explosion -->
  <g transform="translate(400, 240)">
    <!-- Mega Star Burst Shockwave -->
    <circle cx="0" cy="0" r="50" fill="none" stroke="#ffffff" stroke-width="3" filter="url(#gm-glow)"/>
    <polygon points="0,-36 36,0 0,36 -36,0" fill="url(#gem-ruby)" stroke="#ffffff" stroke-width="3" filter="url(#gm-glow)"/>
    <!-- 8-point sparkling light beam -->
    <line x1="0" y1="-70" x2="0" y2="70" stroke="#ffffff" stroke-width="3" filter="url(#gm-glow)"/>
    <line x1="-70" y1="0" x2="70" y2="0" stroke="#ffffff" stroke-width="3" filter="url(#gm-glow)"/>
    <line x1="-45" y1="-45" x2="45" y2="45" stroke="#fde047" stroke-width="2" filter="url(#gm-glow)"/>
    <line x1="45" y1="-45" x2="-45" y2="45" stroke="#fde047" stroke-width="2" filter="url(#gm-glow)"/>
  </g>
  <g transform="translate(480, 240)">
    <polygon points="0,-28 28,0 0,28 -28,0" fill="url(#gem-ruby)" stroke="#fca5a5" stroke-width="2"/>
  </g>
  <g transform="translate(560, 240)">
    <!-- Emerald -->
    <polygon points="-24,-10 -10,-24 10,-24 24,-10 24,10 10,24 -10,24 -24,10" fill="url(#gem-emerald)" stroke="#86efac" stroke-width="2"/>
  </g>

  <!-- Row 3 -->
  <g transform="translate(240, 320)">
    <circle cx="0" cy="0" r="24" fill="url(#gem-amethyst)" stroke="#f0abfc" stroke-width="2"/>
  </g>
  <g transform="translate(320, 320)">
    <polygon points="0,-26 28,22 -28,22" fill="url(#gem-topaz)" stroke="#fef08a" stroke-width="2"/>
  </g>
  <g transform="translate(400, 320)">
    <polygon points="0,-28 24,-14 24,14 0,28 -24,14 -24,-14" fill="url(#gem-sapphire)" stroke="#93c5fd" stroke-width="2"/>
  </g>
  <g transform="translate(480, 320)">
    <polygon points="-24,-10 -10,-24 10,-24 24,-10 24,10 10,24 -10,24 -24,10" fill="url(#gem-emerald)" stroke="#86efac" stroke-width="2"/>
  </g>
  <g transform="translate(560, 320)">
    <polygon points="0,-26 28,22 -28,22" fill="url(#gem-topaz)" stroke="#fef08a" stroke-width="2"/>
  </g>

  <!-- Titles -->
  <text x="30" y="45" font-family="'Orbitron', sans-serif" font-weight="800" font-size="20" fill="#f472b6" letter-spacing="3">GEM MATCH</text>
  <text x="30" y="70" font-family="'Chakra Petch', sans-serif" font-weight="600" font-size="12" fill="#fde047" letter-spacing="4">CASCADE MATCH-3 PUZZLE</text>
  <rect x="690" y="30" width="80" height="24" rx="4" fill="#a855f7" fill-opacity="0.2" stroke="#d8b4fe" stroke-width="1.5"/>
  <text x="730" y="46" font-family="'Orbitron', sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">PUZZLE</text>
</svg>
