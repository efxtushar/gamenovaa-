<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cr-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#05050f"/>
      <stop offset="50%" stop-color="#0a0520"/>
      <stop offset="100%" stop-color="#000005"/>
    </linearGradient>
    <filter id="cr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#cr-bg)"/>

  <!-- Infinite Perspective Tunnel Rings (Neon Geometric Gates) -->
  <!-- Tunnel concentric hexagons -->
  <polygon points="400,195 435,210 435,240 400,255 365,240 365,210" fill="none" stroke="#f43f5e" stroke-width="2" opacity="0.3"/>
  <polygon points="400,165 470,195 470,255 400,285 330,255 330,195" fill="none" stroke="#06b6d4" stroke-width="2.5" opacity="0.5"/>
  <polygon points="400,120 530,165 530,285 400,330 270,285 270,165" fill="none" stroke="#eab308" stroke-width="3" opacity="0.7"/>
  <polygon points="400,60 620,135 620,315 400,390 180,315 180,135" fill="none" stroke="#a855f7" stroke-width="4" opacity="0.9" filter="url(#cr-glow)"/>
  <polygon points="400,-10 740,95 740,355 400,460 60,355 60,95" fill="none" stroke="#00ffff" stroke-width="5" filter="url(#cr-glow)"/>

  <!-- Glowing Color Gate Obstacles in Flight -->
  <!-- Cyan Barrier Segment -->
  <path d="M 400 60 L 620 135 L 620 225 L 400 225 Z" fill="#06b6d4" fill-opacity="0.3" stroke="#06b6d4" stroke-width="3" filter="url(#cr-glow)"/>
  
  <!-- Magenta Barrier Segment -->
  <path d="M 400 225 L 620 225 L 620 315 L 400 390 Z" fill="#ec4899" fill-opacity="0.3" stroke="#ec4899" stroke-width="3" filter="url(#cr-glow)"/>

  <!-- Yellow Barrier Segment -->
  <path d="M 400 60 L 180 135 L 180 315 L 400 390 Z" fill="#eab308" fill-opacity="0.3" stroke="#eab308" stroke-width="3" filter="url(#cr-glow)"/>

  <!-- Player Prism Orb (Hyperspeed Core) in Center -->
  <g transform="translate(400, 225)">
    <!-- Light Trail Rays -->
    <line x1="0" y1="0" x2="-80" y2="-120" stroke="#06b6d4" stroke-width="3" filter="url(#cr-glow)"/>
    <line x1="0" y1="0" x2="80" y2="-120" stroke="#ec4899" stroke-width="3" filter="url(#cr-glow)"/>
    <line x1="0" y1="0" x2="0" y2="140" stroke="#eab308" stroke-width="3" filter="url(#cr-glow)"/>

    <!-- Glowing Core -->
    <circle cx="0" cy="0" r="32" fill="#ffffff" filter="url(#cr-glow)"/>
    <circle cx="0" cy="0" r="24" fill="#06b6d4"/>
    <polygon points="0,-16 14,10 -14,10" fill="#ffffff"/>
  </g>

  <!-- Titles -->
  <text x="30" y="45" font-family="'Orbitron', sans-serif" font-weight="800" font-size="20" fill="#06b6d4" letter-spacing="3">COLOR RUSH</text>
  <text x="30" y="70" font-family="'Chakra Petch', sans-serif" font-weight="600" font-size="12" fill="#ec4899" letter-spacing="4">SPEED COLOR TUNNEL RUNNER</text>
  <rect x="690" y="30" width="80" height="24" rx="4" fill="#0891b2" fill-opacity="0.2" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="730" y="46" font-family="'Orbitron', sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">ARCADE</text>
</svg>
